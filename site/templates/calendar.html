{% extends "base.html" %}
{% block title %}Kalender{% endblock %}
{% block content %}
<div class="wrap page-head">
  <h1>Kalender</h1>
  <p class="lede">Gudstjänster, konserter, studiecirklar och mycket mer.</p>
</div>
<div class="wrap">
  <form class="toolbar" onsubmit="return false">
    <label>Från <input type="date" id="from"></label>
    <label>Till <input type="date" id="to"></label>
    <label>Ort
      <select id="city"><option value="">Alla orter</option>{% for c in cities %}<option>{{ c }}</option>{% endfor %}</select>
    </label>
    <label>Typ
      <select id="category"><option value="">Allt</option>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
    </label>
  </form>
  <div id="calendar" aria-live="polite"></div>
  <div class="more-wrap" id="cal-more-wrap" hidden>
    <button type="button" class="button button-secondary" id="cal-more">Visa fler</button>
  </div>
  <p class="empty" id="cal-empty" hidden>Inga händelser matchar filtret.</p>
</div>
{% endblock %}
{% block scripts %}<script>window.ROOT = "{{ root }}"; window.V = "{{ v }}";</script><script src="{{ root }}static/calendar.js?v={{ v }}" defer></script>{% endblock %}
