# Builds the PUBLIC site from OpenStreetMap (real churches, openly licensed) and deploys it to
# GitHub Pages. Nothing from Kyrktorget is used here. If OpenStreetMap cannot be reached, the
# fictional sample data is used instead so the site still deploys.
name: Deploy demo site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # weekly rebuild with fresh OpenStreetMap data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-site.txt
      - name: Download churches from OpenStreetMap
        run: python data/build_public_db.py --out data/public.db || python data/seed_sample.py --out data/public.db
      - run: python site/build_site.py --db data/public.db --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
