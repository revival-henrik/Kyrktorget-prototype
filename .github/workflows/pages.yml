# Builds the PUBLIC demo from fictional sample data and deploys it to GitHub Pages.
# Real scraped data is never used here.
name: Deploy demo site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # weekly rebuild so demo calendar dates stay current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-site.txt
      - run: python data/seed_sample.py --out data/sample.db
      - run: python site/build_site.py --db data/sample.db --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
